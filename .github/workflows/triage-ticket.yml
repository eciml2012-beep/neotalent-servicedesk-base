# Sesión 5 (IA agéntica) – ejercicio del profesor adaptado a este repo.
# Cada día a las 06:00 UTC (o a mano desde la pestaña Actions) Claude busca el ticket
# "Sin clasificar" más antiguo y escribe su diagnóstico en docs/diagnostico-<id>.md.
# Requisito: secreto del repo CLAUDE_CODE_OAUTH_TOKEN (se genera en local con `claude setup-token`).
name: Triar ticket sin clasificar

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC todos los días
  workflow_dispatch:       # botón "Run workflow" en la pestaña Actions

permissions:
  contents: write          # para poder subir el diagnóstico al repo

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # Hook (freno determinista): antes de cada comando Bash, si contiene 'git push', lo bloquea
      # sin preguntar al modelo (exit 2). El push lo hace el paso siguiente, no Claude.
      - name: Triar ticket más antiguo sin clasificar (claude -p, modo headless)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "Lee data/tickets.json. Cada ticket trae su categoría en sugerencia.categoria (las reglas están en js/utils/clasificador-nuevo-ticket.js; léelas, no las reinventes).
          De los tickets cuya categoría sea 'Sin clasificar', localiza el que tenga el campo fecha más antiguo. Si hay empate de fecha, el de id menor.
          Según docs/constitution.md y js/utils/prioridad.js, un ticket 'Sin clasificar' no tiene prioridad asignable: no la calcules, indica solo que no aplica.
          Escribe el diagnóstico en un archivo NUEVO docs/diagnostico-<id>.md (sustituye <id> por el id real del ticket) con: id, título, zona, fecha, estado, categoría ('Sin clasificar'), el motivo que trae el ticket, qué palabras clave de las reglas habría necesitado para clasificarse, y una nota de por qué no tiene prioridad.
          Si ese archivo ya existe, no lo toques y termina diciendo que ya estaba hecho.
          No modifiques ni borres ningún otro archivo del repositorio." \
            --allowedTools "Read,Write,Glob,Grep" \
            --permission-mode dontAsk \
            --max-turns 15 \
            --settings '{"hooks":{"PreToolUse":[{"matcher":"Bash","hooks":[{"type":"command","command":"jq -r .tool_input.command | grep -q \"git push\" && { echo \"Bloqueado por hook: Claude no puede hacer git push\" >&2; exit 2; } || exit 0"}]}]}}'

      - name: Subir el diagnóstico al repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostico-*.md
          git diff --cached --quiet && echo "Nada nuevo que subir" && exit 0
          git commit -m "Diagnóstico automático del ticket sin clasificar más antiguo"
          git push
