# Regresión completa en cada PR y en cada push a main (skill qa-triaje, "Cuándo se prueba").
# La regresión visual (@visual) se excluye: sus capturas de referencia son de Windows (-win32) y en
# Linux cambian las fuentes. Se sigue pasando en local con `npm test`.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # el servidor de pruebas es http.server de Python
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep-invert @visual
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: informe-playwright
          path: playwright-report/
          retention-days: 14
